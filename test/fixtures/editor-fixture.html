<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rogatio editor fixture</title>
    <link rel="stylesheet" href="/editor/index.css" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background-color: #121417;
        background-image: radial-gradient(
          rgba(255, 255, 255, 0.05) 1px,
          transparent 1px
        );
        background-size: 24px 24px;
      }
      #editor-root {
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="editor-root"></div>
    <script type="module">
      import { createEditor } from "/editor/index.js";

      const project = {
        version: 2,
        name: "Editor project",
        description: "A project for the editor journey",
        groups: [
          {
            id: "group-one",
            name: "One",
            rules: [
              {
                id: "rule-one",
                name: "First rule",
                source: {
                  key: "url",
                  operator: "regex",
                  value: "^https://one\\.example/first$",
                },
                resourceTypes: ["main_frame"],
                priority: 100,
              },
              {
                id: "rule-two",
                name: "Second rule",
                source: {
                  key: "url",
                  operator: "regex",
                  value: "^https://one\\.example/second$",
                },
                resourceTypes: ["script"],
                priority: 200,
              },
            ],
          },
          {
            id: "group-two",
            name: "Two",
            rules: [
              {
                id: "rule-three",
                name: "Third rule",
                source: {
                  key: "url",
                  operator: "regex",
                  value: "^https://two\\.example/third$",
                },
                resourceTypes: ["image"],
                priority: 300,
              },
            ],
          },
        ],
      };

      function diagnostic(code, path, message) {
        return { code, severity: "error", path, message };
      }

      function validate(value) {
        const errors = [];
        if (!value || typeof value !== "object") {
          return [diagnostic("fixture.invalid", "", "The project is invalid.")];
        }
        if (typeof value.name !== "string" || value.name.trim() === "") {
          errors.push(
            diagnostic("schema.invalid-value", "/name", "Enter a project name."),
          );
        }
        if (!Array.isArray(value.groups)) return errors;
        value.groups.forEach((group, groupIndex) => {
          if (typeof group.name !== "string" || group.name.trim() === "") {
            errors.push(
              diagnostic(
                "schema.invalid-value",
                `/groups/${groupIndex}/name`,
                "Enter a group name.",
              ),
            );
          }
          if (!Array.isArray(group.rules)) return;
          group.rules.forEach((rule, ruleIndex) => {
            const rulePath = `/groups/${groupIndex}/rules/${ruleIndex}`;
            if (typeof rule.name !== "string" || rule.name.trim() === "") {
              errors.push(
                diagnostic(
                  "schema.invalid-value",
                  `${rulePath}/name`,
                  "Enter a rule name.",
                ),
              );
            }
            const source = rule.source;
            const sourceValue =
              source &&
              typeof source === "object" &&
              typeof source.value === "string"
                ? source.value
                : "";
            if (sourceValue === "" || sourceValue === "[") {
              errors.push(
                diagnostic(
                  "schema.invalid-format",
                  `${rulePath}/source/value`,
                  "Enter a valid regular expression.",
                ),
              );
            }
          });
        });
        return errors;
      }

      const editorTest = {
        saveCalls: [],
        pending: [],
        saveMode: "auto",
        setSaveMode(mode) {
          this.saveMode = mode;
        },
        resolveSave(index, result) {
          this.pending[index]?.resolve(result);
        },
      };

      function save(value) {
        editorTest.saveCalls.push(structuredClone(value));
        if (editorTest.saveMode === "fail") {
          return Promise.resolve({
            ok: false,
            code: "host.write-failed",
            message: "The host could not save the project.",
          });
        }
        if (editorTest.saveMode === "pending") {
          return new Promise((resolve) => {
            editorTest.pending.push({ resolve });
          });
        }
        return Promise.resolve({ ok: true });
      }

      window.editorModule = { createEditor };
      window.editorTest = editorTest;
      window.editorController = createEditor({
        root: document.querySelector("#editor-root"),
        initialProject: project,
        validate,
        save,
      });
    </script>
  </body>
</html>
