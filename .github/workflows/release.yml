name: Release

# Real releases run only after "Repository checks" succeeds for a push to main.
# workflow_dispatch stays available as a dry run and does not publish.
# npm publish runs in this file. The @rogatio/cli trusted publisher is bound to
# the filename release.yml, with no GitHub environment. Do not rename this file
# or move publish into a called workflow. Do not pass NPM_TOKEN or NODE_AUTH_TOKEN.

on:
  workflow_run:
    workflows: ["Repository checks"]
    types: [completed]
  workflow_dispatch:

# No workflow-level token. The release job grants the scopes it needs.
permissions: {}

# Share `release` only for a successful push to main. GitHub keeps one pending
# run per group even when cancel-in-progress is false, so a pull-request checks
# completion must not take that slot and drop a queued publish. Other runs,
# including workflow_dispatch (no workflow_run payload), use github.run_id.
concurrency:
  group: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' && 'release' || github.run_id }}
  cancel-in-progress: false

env:
  NODE_VERSION: 26.11.1
  # Trusted publishing needs npm CLI >= 11.5.1. Pin the newest 11.x so the job
  # does not follow whatever npm ships inside the Node 26 image.
  NPM_VERSION: "11.21.0"

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event == 'push'
      )
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout the verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check out that commit on its branch
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RELEASE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.event.workflow_run.head_branch }}
        run: |
          git checkout -B "$RELEASE_BRANCH" "$RELEASE_SHA"
          git rev-parse --abbrev-ref HEAD
          git rev-parse HEAD

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install npm CLI for trusted publishing
        run: node scripts/assert-release-toolchain.mjs

      - name: Build
        run: pnpm build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          GITHUB_REF: ${{ github.event_name == 'workflow_dispatch' && github.ref || 'refs/heads/main' }}
          GITHUB_REF_NAME: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'main' }}
          NPM_CONFIG_PROVENANCE: "true"
          RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: node scripts/run-semantic-release.mjs

      - name: Attest extension ZIP
        if: >-
          success() &&
          github.event_name == 'workflow_run' &&
          hashFiles('packages/extension/dist/rogatio-extension.zip') != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: packages/extension/dist/rogatio-extension.zip
